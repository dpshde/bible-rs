name: Sync route.bible adapters

on:
  schedule:
    # Daily; route.bible also fires repository_dispatch on each prod publish.
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [route-bible-adapters]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Pull adapters feed → PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from route.bible feed
        env:
          # Override for preview: set repo variable ROUTE_BIBLE_FEED, or default to prod.
          ROUTE_BIBLE_FEED: ${{ vars.ROUTE_BIBLE_FEED || 'https://route.bible/adapters/v1' }}
        run: scripts/sync-adapters

      - name: Read adapters version
        id: version
        run: |
          ver="$(tr -d '[:space:]' < crates/core/data/adapters.version)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync route.bible adapters ${{ steps.version.outputs.version }}"
          title: "chore: sync route.bible adapters ${{ steps.version.outputs.version }}"
          body: |
            Automated sync of the [route.bible](https://route.bible) adapters feed into `crates/core/data/`.

            - Feed: `${{ vars.ROUTE_BIBLE_FEED || 'https://route.bible/adapters/v1' }}`
            - Version: `${{ steps.version.outputs.version }}`
            - Script: `scripts/sync-adapters` (sha256-verified icons)

            Triggered by `${{ github.event_name }}`.
          branch: chore/sync-route-bible-adapters
          delete-branch: true
          add-paths: |
            crates/core/data/adapters.links.json
            crates/core/data/adapters.version
            crates/core/data/adapter-icons.json
            crates/core/data/adapter-icons/**
